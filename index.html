<!DOCTYPE html>

    <script>
      // Applique le thème avant le premier affichage : sans cela, la page apparaît en clair
      // puis passe en sombre quand l'application démarre. Même règle que l'application :
      // la landing est claire sauf choix explicite, les autres pages suivent le thème enregistré (sombre par défaut).
      (function () {
        try {
          var saved = localStorage.getItem('ecosurv_theme');
          var explicit = localStorage.getItem('ecosurv_theme_explicit');
          var p = location.pathname.replace(/\/+$/, '') || '/';
          var landing = p === '/' || p === '/landing';
          var theme = landing && !explicit ? 'light' : saved || 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Fond du document dès le premier affichage (mêmes couleurs que le corps de page : slate-50 / slate-950). */
      html { background: #f8fafc; }
      html.dark { background: #020617; }
      /* Écran de démarrage : logo seul, remplacé par React au montage. Aucune incidence sur la mise en page (position fixe). */
      .splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .splash svg { width: 72px; height: 72px; animation: splash-pulse 1.4s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .splash svg { animation: none; } }
    </style>
    <noscript><style>.splash { display: none; }</style></noscript>
